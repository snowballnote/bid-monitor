<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서류 관리 | Biz Assist</title>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/submissions/submissions.css">
    <link rel="stylesheet" href="/documents/documents.css">
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <a class="app-brand" href="/" aria-label="Biz Assist 홈">
            <span class="app-brand-mark" aria-hidden="true">BA</span>
            <span><strong>Biz Assist</strong><small>경영지원 업무지원</small></span>
        </a>
        <nav class="app-nav" aria-label="주요 메뉴">
            <a class="app-nav-link" href="/">홈</a>
            <a class="app-nav-link" href="/bids/">입찰공고</a>
            <a class="app-nav-link" href="/notices/">외부 중요공지</a>
            <a class="app-nav-link" href="/notifications/">알림 관리</a>
            <a class="app-nav-link" href="/submissions/">서류 모으기</a>
            <a class="app-nav-link active" href="/documents/" aria-current="page">서류 관리</a>
        </nav>
        <p class="app-sidebar-description">경영지원에 필요한 정보를 한곳에서 확인하세요.</p>
    </aside>

    <main class="app-main">
        <header class="submission-topbar" aria-label="현재 위치">
            <span>Biz Assist</span><span aria-hidden="true">/</span><strong>서류 관리</strong>
        </header>
        <div class="page-container submission-page">
            <header class="page-header page-heading page-heading-actions">
                <div>
                    <span class="page-eyebrow">SUBMISSION</span>
                    <h1>서류 관리</h1>
                    <p>회사 공통서류의 현재 파일을 등록하고 교체합니다.</p>
                </div>
                <button id="document-create-open" class="ui-button ui-button-primary" type="button">+ 서류 추가</button>
            </header>


            <p id="documents-message" role="status"></p>
            <section class="surface-card documents-list" aria-label="회사 공통서류" tabindex="0">
                <table class="submission-project-table documents-table">
                    <thead><tr><th scope="col">서류명</th><th scope="col">카테고리</th><th scope="col">현재 파일</th><th scope="col">상태</th><th scope="col">관리</th></tr></thead>
                    <tbody id="document-rows"></tbody>
                </table>
            </section>
        </div>
    </main>
</div>
<dialog id="document-create-dialog" class="common-document-dialog" aria-labelledby="document-create-title">
    <form id="document-create-form">
        <header><h2 id="document-create-title">서류 추가</h2></header>
        <label>서류명 <input name="name" maxlength="200" required autofocus></label>
        <label>카테고리 <select name="category"><option value="COMPANY_COMMON">회사 공통</option></select></label>
        <p id="document-create-message" class="submission-message" role="alert"></p>
        <footer>
            <button id="document-create-cancel" class="ui-button ui-button-secondary" type="button">취소</button>
            <button class="ui-button ui-button-primary" type="submit">추가</button>
        </footer>
    </form>
</dialog>
<script src="/documents/documents.js"></script>
</body></html>
