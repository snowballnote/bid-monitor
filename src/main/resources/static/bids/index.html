<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입찰공고 | Biz Assist</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/common.css">
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <a class="app-brand" href="/" aria-label="Biz Assist 홈">
            <span class="app-brand-mark" aria-hidden="true">BA</span>
            <span><strong>Biz Assist</strong><small>경영지원 업무지원</small></span>
        </a>
        <nav class="app-nav" aria-label="주요 메뉴">
            <a class="app-nav-link" href="/">홈</a>
            <a class="app-nav-link active" href="/bids/" aria-current="page">입찰공고</a>
            <a class="app-nav-link" href="/notices/">외부 중요공지</a>
            <a class="app-nav-link" href="/notifications/">알림 관리</a>
        </nav>
        <p class="app-sidebar-description">경영지원에 필요한 정보를 한곳에서 확인하세요.</p>
    </aside>
    <div class="app-main">
        <main class="page-container bid-page">
            <header class="page-header page-heading">
                <span class="page-eyebrow">BIDS</span>
                <h1>입찰공고</h1>
                <p>감리 관련 입찰공고를 조회하고 검토합니다.</p>
            </header>
            <section class="notice-board surface-card" aria-label="감리 입찰공고 목록">
                <div class="search-area">
                    <div class="search-main-controls">
                        <div class="quick-search" aria-label="빠른 기간 조회">
                            <span class="search-label">빠른 조회</span>
                            <button type="button" class="quick-button" data-days="1">오늘</button>
                            <button type="button" class="quick-button" data-days="3">최근 3일</button>
                            <button type="button" class="quick-button" data-days="7">최근 7일</button>
                        </div>
                        <form id="range-search-form" class="range-search">
                            <label for="start-date">시작일</label><input type="date" id="start-date" name="startDate">
                            <label for="end-date">종료일</label><input type="date" id="end-date" name="endDate">
                            <button type="submit" class="search-button">조회</button>
                            <p id="current-period" class="current-period" aria-live="polite"></p>
                        </form>
                    </div>
                    <p id="validation-message" class="validation-message hidden" role="alert"></p>
                    <div class="license-code-manager" aria-labelledby="license-code-title">
                        <div class="license-code-heading">
                            <span id="license-code-title" class="search-label">허용 업종코드</span>
                            <span class="license-code-help">숫자 4자리 코드를 최소 1개 이상 관리할 수 있습니다.</span>
                        </div>
                        <div id="license-code-tags" class="license-code-tags" aria-live="polite"></div>
                        <form id="license-code-form" class="license-code-form">
                            <label for="license-code-input" class="sr-only">허용 업종코드 입력</label>
                            <input type="text" id="license-code-input" inputmode="numeric" pattern="[0-9]{4}"
                                   maxlength="4" placeholder="숫자 4자리" autocomplete="off">
                            <button type="submit" class="license-add-button">추가</button>
                        </form>
                        <p id="license-code-message" class="validation-message hidden" role="alert"></p>
                    </div>
                </div>
                <div id="loading-message" class="message">공고 목록을 불러오는 중입니다.</div>
                <div id="empty-message" class="message hidden">선택한 기간에 검토할 대상 공고가 없습니다.</div>
                <div id="error-message" class="message error hidden">공고 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>
                <div id="table-wrapper" class="table-wrapper hidden">
                    <table>
                        <thead><tr>
                            <th>검토상태</th><th>공고명</th><th>공고기관</th><th>배정예산</th><th>입찰마감</th>
                            <th>낙찰방법</th><th>지역제한</th><th>확인사항</th><th>상세</th>
                        </tr></thead>
                        <tbody id="bid-list"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div id="document-analysis-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"
     aria-labelledby="document-analysis-title">
    <div class="analysis-modal service-modal">
        <div class="analysis-modal-header service-modal-header">
            <div><span class="analysis-modal-eyebrow">입찰 검토 지원</span><h2 id="document-analysis-title">입찰공고 상세</h2></div>
            <button id="analysis-modal-close" type="button" class="modal-close-button" aria-label="입찰공고 상세 닫기">×</button>
        </div>
        <div id="analysis-modal-content" class="analysis-modal-content"></div>
    </div>
</div>
<script src="/app.js"></script>
</body>
</html>
