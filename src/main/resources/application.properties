spring.application.name=bid-monitor

# 실행 디렉터리의 data 폴더에 H2 파일을 두어 애플리케이션 재시작 후에도 공지를 유지한다.
spring.datasource.url=jdbc:h2:file:./data/bid-monitor
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

g2b.api.base-url=https://apis.data.go.kr/1230000/ad/BidPublicInfoService
g2b.api.service-key=${G2B_SERVICE_KEY}

# 외부공지 자동 수집은 직전 실행이 끝난 시점부터 기본 1시간 뒤에 다시 실행한다.
external-notice.scheduler.enabled=true
external-notice.scheduler.fixed-delay=3600000
external-notice.scheduler.initial-delay=3600000
# 필요할 때만 시작 직후 별도 1회 수집하며, 기본값은 초기 지연 후 첫 주기 실행이다.
external-notice.scheduler.run-on-startup=false
