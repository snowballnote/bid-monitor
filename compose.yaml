services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bid_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-bid_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bid-monitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  bid-monitor-postgres-data:
