<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 감리 입찰공고</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page-container">
    <header class="page-header">
        <h1>오늘의 감리 입찰공고</h1>
        <p>자동 판정된 대상 공고의 참가조건을 확인합니다.</p>
    </header>

    <section class="notice-board" aria-label="감리 입찰공고 목록">
        <div class="search-area">
            <div class="quick-search" aria-label="빠른 기간 조회">
                <span class="search-label">빠른 조회</span>
                <button type="button" class="quick-button" data-days="1">오늘</button>
                <button type="button" class="quick-button" data-days="3">최근 3일</button>
                <button type="button" class="quick-button" data-days="7">최근 7일</button>
            </div>

            <form id="range-search-form" class="range-search">
                <label for="start-date">시작일</label>
                <input type="date" id="start-date" name="startDate">
                <label for="end-date">종료일</label>
                <input type="date" id="end-date" name="endDate">
                <button type="submit" class="search-button">조회</button>
                <p id="current-period" class="current-period" aria-live="polite"></p>
            </form>

            <p id="validation-message" class="validation-message hidden" role="alert"></p>

            <div class="license-code-manager" aria-labelledby="license-code-title">
                <div class="license-code-heading">
                    <span id="license-code-title" class="search-label">허용 업종코드</span>
                    <span class="license-code-help">숫자 4자리 코드를 최소 1개 이상 관리할 수 있습니다.</span>
                </div>
                <div id="license-code-tags" class="license-code-tags" aria-live="polite"></div>
                <form id="license-code-form" class="license-code-form">
                    <label for="license-code-input" class="sr-only">허용 업종코드 입력</label>
                    <input
                            type="text"
                            id="license-code-input"
                            inputmode="numeric"
                            pattern="[0-9]{4}"
                            maxlength="4"
                            placeholder="숫자 4자리"
                            autocomplete="off"
                    >
                    <button type="submit" class="license-add-button">추가</button>
                </form>
                <p id="license-code-message" class="validation-message hidden" role="alert"></p>
            </div>

        </div>

        <div id="loading-message" class="message">공고 목록을 불러오는 중입니다.</div>
        <div id="empty-message" class="message hidden">선택한 기간에 검토할 대상 공고가 없습니다.</div>
        <div id="error-message" class="message error hidden">공고 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>

        <div id="table-wrapper" class="table-wrapper hidden">
            <table>
                <thead>
                <tr>
                    <th>검토상태</th>
                    <th>공고명</th>
                    <th>공고기관</th>
                    <th>배정예산</th>
                    <th>입찰마감일시</th>
                    <th>낙찰방법</th>
                    <th>면허조건</th>
                    <th>지역제한</th>
                    <th>판정사유</th>
                    <th>외부확인</th>
                    <th>상세보기</th>
                </tr>
                </thead>
                <tbody id="bid-list"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
