spring.application.name=bid-monitor

# 실행 디렉터리의 data 폴더에 H2 파일을 두어 애플리케이션 재시작 후에도 공지를 유지한다.
spring.datasource.url=jdbc:h2:file:./data/bid-monitor
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Company DB is opt-in and is isolated from the primary Biz Assist H2 database.
company-db.enabled=${COMPANY_DB_ENABLED:false}
company-db.url=${COMPANY_DB_URL:}
company-db.username=${COMPANY_DB_USERNAME:}
company-db.password=${COMPANY_DB_PASSWORD:}
company-db.driver-class-name=${COMPANY_DB_DRIVER:org.postgresql.Driver}
company-db.maximum-pool-size=2
company-db.connection-timeout-millis=5000
company-db.query-timeout-seconds=10
company-db.max-rows=500

g2b.api.base-url=https://apis.data.go.kr/1230000/ad/BidPublicInfoService
g2b.api.service-key=${G2B_SERVICE_KEY}

# 나라장터 공고정보서비스에 포함되지 않는 한국도로공사 공개 용역공고를 보완 수집한다.
bid-source.korea-expressway.enabled=true
bid-source.korea-expressway.base-url=https://ebid.ex.co.kr

# 앱 준비 후 기본 10초에 첫 수집을 시작하고, 직전 실행 완료 시점부터 기본 10분 뒤 다시 실행한다.
external-notice.scheduler.enabled=true
external-notice.scheduler.fixed-delay-ms=${EXTERNAL_NOTICE_SCHEDULER_FIXED_DELAY_MS:600000}
external-notice.scheduler.initial-delay-ms=${EXTERNAL_NOTICE_SCHEDULER_INITIAL_DELAY_MS:10000}
# 필요할 때만 ApplicationReady 직후 별도 실행하며, 기본값은 짧은 초기 지연 후 첫 주기 실행이다.
external-notice.scheduler.run-on-startup=false

# 실제 메일 발송은 명시적으로 활성화하고 환경변수를 제공한 경우에만 수행한다.
biz-assist.mail.enabled=false
biz-assist.mail.host=${BIZ_ASSIST_MAIL_HOST:}
biz-assist.mail.port=${BIZ_ASSIST_MAIL_PORT:587}
biz-assist.mail.username=${BIZ_ASSIST_MAIL_USERNAME:}
biz-assist.mail.password=${BIZ_ASSIST_MAIL_PASSWORD:}
biz-assist.mail.from=${BIZ_ASSIST_MAIL_FROM:}
biz-assist.mail.auth=${BIZ_ASSIST_MAIL_AUTH:true}
biz-assist.mail.starttls-enabled=${BIZ_ASSIST_MAIL_STARTTLS_ENABLED:true}
biz-assist.mail.ssl-enabled=${BIZ_ASSIST_MAIL_SSL_ENABLED:false}
biz-assist.mail.connection-timeout=5000
biz-assist.mail.read-timeout=10000
biz-assist.mail.write-timeout=10000

# Read-only mounted NAS root for performance evidence ZIP downloads.
performance.nas-root=${PERFORMANCE_NAS_ROOT:}

# FMS Drive: server-side SESSION cookie and configurable search roots; no credentials in API responses.
performance.drive.base-url=${FMS_DRIVE_BASE_URL:}
performance.drive.session-token=${FMS_DRIVE_SESSION_TOKEN:}
performance.drive.company=${FMS_DRIVE_COMPANY:CNH}
# Shared business roots, independent of feature-specific search folders.
performance.drive.index-roots=${FMS_DRIVE_INDEX_ROOTS:/컴앤휴먼_경영지원_사업관리}
performance.drive.certificate-folders=${FMS_DRIVE_CERTIFICATE_FOLDERS:}
performance.drive.contract-folders=${FMS_DRIVE_CONTRACT_FOLDERS:}
# -1 traverses all depths. Limits fail the refresh without publishing partial data.
performance.drive.max-depth=${FMS_DRIVE_MAX_DEPTH:-1}
performance.drive.max-folders=${FMS_DRIVE_MAX_FOLDERS:100}
performance.drive.max-files=${FMS_DRIVE_MAX_FILES:5000}
